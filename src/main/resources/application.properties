spring.application.name=spring-rest-demo
# H2 (geliştirme / demo)
spring.datasource.url=jdbc:h2:mem:workboard;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Yerel Gemini anahtarı: proje kökünde application-local.properties (gitignore)
spring.config.import=optional:file:./application-local.properties
# Cloud Run ve benzeri ortamlar PORT ile dinler; yerelde 8080 varsayılan
server.port=${PORT:8080}
# Tüm ağ arayüzlerinde dinle (telefon / başka makineden erişim için)
server.address=0.0.0.0

# OpenAPI / Swagger UI (springdoc)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Google Gemini — anahtar: GEMINI_API_KEY veya application-local.properties içinde gemini.api.key
gemini.api.key=${GEMINI_API_KEY:}
# Model sabit: gemini-2.5-flash (GeminiService.MODEL_ID; eski gemini-2.0-flash yeni API anahtarlarında 404)
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.temperature=0.35
gemini.api.max-tokens=8192
